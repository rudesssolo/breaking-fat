<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#f4f6f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12160f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Breaking Fat">
<link rel="icon" type="image/png" sizes="512x512" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<title>Breaking Fat — Meal Prep & Movimento</title>
<style>
:root{
  --bg:#f2f5f1; --card:#ffffff; --card2:#f7faf5; --text:#1c231c; --muted:#5a685c;
  --accent:#2e7d32; --accent2:#1b5e20; --soft:#e3f1e4; --soft2:#d3e8d5;
  --border:#dde5dd; --ok:#2e7d32; --warn:#c62828; --chip:#eef4ee;
  --shadow:0 1px 3px rgba(20,40,20,.08),0 4px 14px rgba(20,40,20,.06);
  --nav:#ffffffee;
}
html[data-theme="dark"]{
  --bg:#12160f; --card:#1b211a; --card2:#20281f; --text:#e7ece5; --muted:#9aa898;
  --accent:#8fce91; --accent2:#a5d8a8; --soft:#263526; --soft2:#2e4230;
  --border:#2c362c; --ok:#8fce91; --warn:#ef9a9a; --chip:#232c22;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --nav:#1b211aee;
}
/* tema automatico: segue il sistema quando l'utente non ha scelto */
@media (prefers-color-scheme:dark){
  html:not([data-theme]){
    --bg:#12160f; --card:#1b211a; --card2:#20281f; --text:#e7ece5; --muted:#9aa898;
    --accent:#8fce91; --accent2:#a5d8a8; --soft:#263526; --soft2:#2e4230;
    --border:#2c362c; --ok:#8fce91; --warn:#ef9a9a; --chip:#232c22;
    --shadow:0 1px 3px rgba(0,0,0,.4);
    --nav:#1b211aee;
  }
  html:not([data-theme]) .chip.warn{background:#3a2422; color:#ef9a9a}
  html:not([data-theme]) .btn{color:#12160f}
  html:not([data-theme]) .btn.ghost{color:var(--accent)}
  html:not([data-theme]) .btn.subtle{color:var(--text)}
  html:not([data-theme]) .btn.danger{color:var(--warn)}
  html:not([data-theme]) .row.done .tick,html:not([data-theme]) .tick.on{color:#12160f}
  html:not([data-theme]) .tbtn{color:#12160f}
  html:not([data-theme]) .calwarn{background:#33291a; border-color:#5c4a22; color:#e8c37a}
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
/* reset per i <button> convertiti da div (.asbtn): stessa specificità (0-1-0) dei
   componenti, che essendo definiti dopo vincono sulle proprietà condivise */
.asbtn{appearance:none;-webkit-appearance:none;border:0;margin:0;padding:0;background:transparent;font:inherit;color:inherit;line-height:inherit;text-align:left;cursor:pointer;border-radius:0;box-shadow:none;display:inline-block}
.xbtn{position:absolute;top:10px;right:10px;z-index:2;width:34px;height:34px;font-size:18px;line-height:1;color:var(--muted);display:inline-flex;align-items:center;justify-content:center}
.xbtn:active{color:var(--text)}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text); font-size:16px; line-height:1.45;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto;
}
button{font:inherit; color:inherit}
h1,h2,h3{margin:0; line-height:1.25}
p{margin:.4em 0}

/* ---------- topbar ---------- */
.topbar{
  position:sticky; top:0; z-index:40; display:flex; align-items:center; gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:var(--nav); backdrop-filter:blur(10px); border-bottom:1px solid var(--border);
}
.brand{display:flex; flex-direction:column; min-width:0}
.brand b{font-size:16px; letter-spacing:.2px}
.brand span{font-size:11.5px; color:var(--muted)}
.topbar .spacer{flex:1}
.iconbtn{
  width:40px;height:40px; border-radius:12px; border:1px solid var(--border);
  background:var(--card); font-size:18px; display:flex;align-items:center;justify-content:center;
  cursor:pointer; flex:none;
}

/* ---------- layout ---------- */
main{padding:14px 14px 8px; display:flex; flex-direction:column; gap:14px}
.card{background:var(--card); border:1px solid var(--border); border-radius:18px; padding:14px; box-shadow:var(--shadow)}
.card h2{font-size:15px; display:flex; align-items:center; gap:8px; margin-bottom:8px}
.card h2 .sub{font-weight:400; font-size:12px; color:var(--muted)}
.sect-title{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:6px 2px -4px; display:flex; align-items:center; gap:6px}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tiny{font-size:11.5px}

/* ---------- barre e chip ---------- */
.bar{height:8px; border-radius:99px; background:var(--chip); overflow:hidden; flex:1}
.bar>i{display:block; height:100%; background:var(--accent); border-radius:99px; transition:width .3s}
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:600; background:var(--chip); color:var(--muted); border-radius:99px; padding:3px 9px}
.chip.ok{background:var(--soft); color:var(--accent2)}
.chip.warn{background:#fdecea; color:#c62828}
html[data-theme="dark"] .chip.warn{background:#3a2422; color:#ef9a9a}
.chip.ok{background:var(--soft); color:var(--accent2)}

/* ---------- pulsanti ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:44px;
  border-radius:13px; border:1px solid var(--accent); background:var(--accent); color:#fff;
  font-weight:600; font-size:14px; padding:8px 16px; cursor:pointer;
}
html[data-theme="dark"] .btn{color:#12160f}
/* varianti a sfondo trasparente/scuro: il testo scuro dei .btn pieni non vale, restano chiare */
html[data-theme="dark"] .btn.ghost{color:var(--accent)}
html[data-theme="dark"] .btn.subtle{color:var(--text)}
html[data-theme="dark"] .btn.danger{color:var(--warn)}
.btn.ghost{background:transparent; color:var(--accent); border-color:var(--accent)}
.btn.subtle{background:var(--chip); color:var(--text); border-color:transparent}
.btn.small{min-height:36px; font-size:13px; padding:5px 12px; border-radius:10px}
.btn.danger{background:transparent; color:var(--warn); border-color:var(--warn)}
.btnrow{display:flex; gap:8px; flex-wrap:wrap}
.btnrow .btn{flex:1; min-width:120px}

/* ---------- tabbar ---------- */
.tabbar{
  position:fixed; bottom:0; left:0; right:0; z-index:40; display:flex; justify-content:center;
  background:var(--nav); backdrop-filter:blur(10px); border-top:1px solid var(--border);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabbar .wrap{display:flex; width:100%; max-width:520px}
.tabbtn{
  flex:1; background:none; border:none; padding:9px 4px 8px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted);
  font-size:10.5px; font-weight:600;
}
.tabbtn .ic{font-size:21px; line-height:1; filter:grayscale(.4); opacity:.75}
.tabbtn.on{color:var(--accent)}
.tabbtn.on .ic{filter:none; opacity:1}

/* ---------- righe spesa / step ---------- */
.row{
  display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border);
  cursor:pointer; user-select:none;
}
.row:last-child{border-bottom:none}
.tick{
  width:34px;height:34px; border-radius:50%; border:2px solid var(--border); flex:none;
  display:flex;align-items:center;justify-content:center; font-size:15px; color:transparent; transition:.15s;
}
.row.done .tick,.tick.on{background:var(--accent); border-color:var(--accent); color:#fff}
html[data-theme="dark"] .row.done .tick,html[data-theme="dark"] .tick.on{color:#12160f}
.row.done .rtext{text-decoration:line-through; color:var(--muted)}
.rtext{min-width:0}
.rtext b{display:block; font-size:14.5px; font-weight:600}
.rtext .q{font-size:12px; color:var(--muted); font-weight:400}
.rtag{margin-left:auto; font-size:11px; color:var(--muted); flex:none}

/* ---------- piano settimanale ---------- */
.plan-head{display:flex; align-items:center; gap:8px; margin:10px 2px 4px}
.plan-head .dname{font-weight:700; font-size:14px; width:64px; flex:none}
.plan-head .dkcal{margin-left:auto; flex:none}
.slots{display:flex; gap:8px; flex:1}
.slot{
  flex:1; background:var(--card2); border:1.5px dashed var(--border); border-radius:13px;
  padding:8px 10px; text-align:left; cursor:pointer; min-width:0;
}
.slot .mtag{font-size:10px; font-weight:800; letter-spacing:.8px; color:var(--muted)}
.slot .mname{font-size:12.5px; font-weight:600; line-height:1.2; margin-top:2px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
.slot .mk{font-size:11px; color:var(--muted); margin-top:2px}
.slot:active{background:var(--soft)}

/* ---------- ricettario ---------- */
.recgrid{display:flex; flex-direction:column; gap:8px}
/* ricettario collassabile nella tab Pasti */
.ricdet>summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; margin:-2px -2px 0}
.ricdet>summary::-webkit-details-marker{display:none}
.ricdet>summary h2{margin:0; flex:1}
.ricdet[open]>summary{margin-bottom:10px}
.ricdet .ricarrow{color:var(--muted); font-size:15px; transition:transform .15s}
.ricdet[open] .ricarrow{transform:rotate(180deg)}
.recitem{
  display:flex; align-items:center; gap:10px; background:var(--card2); border:1px solid var(--border);
  border-radius:14px; padding:10px 12px; cursor:pointer; text-align:left; width:100%;
}
.recitem .rico{font-size:22px; flex:none}
.recitem .rt{min-width:0; flex:1}
.recitem .rt b{display:block; font-size:14px}
.recitem .rt span{font-size:11.5px; color:var(--muted)}
.recitem .arrow{color:var(--muted); flex:none}

/* ---------- dettaglio ricetta ---------- */
.sheet .ing li{margin:3px 0}
.dl{display:grid; grid-template-columns:auto 1fr; gap:4px 10px; font-size:13.5px; margin:8px 0}
.dl dt{font-weight:700; color:var(--muted); white-space:nowrap}
.dl dd{margin:0}
.steps li{margin:6px 0}

/* ---------- tabelle movimento ---------- */
.mrow{
  display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--border);
}
.mrow:last-child{border-bottom:none}
.mrow.today{background:var(--soft); border-radius:12px; padding-left:8px; padding-right:8px}
.mrow .mday{width:74px; flex:none; font-weight:700; font-size:13px}
.mrow .mact{flex:1; font-size:13px; min-width:0}
.mrow .mact .p{font-size:11px; color:var(--muted)}
.mrow .tick{cursor:pointer}

/* ---------- input ---------- */
input[type=text],input[type=number],input[type=search],select,textarea{
  font:inherit; color:var(--text); background:var(--card2); border:1.5px solid var(--border);
  border-radius:12px; padding:10px 12px; width:100%; outline:none; min-height:44px;
}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input[type=checkbox].big{width:22px;height:22px; accent-color:var(--accent)}
.field{display:flex; flex-direction:column; gap:4px; margin:10px 0}
.field label{font-size:12px; font-weight:700; color:var(--muted)}
.ingrow{display:grid; grid-template-columns:1.6fr .7fr .8fr .8fr auto; gap:6px; align-items:center}
.ingrow input,.ingrow select{min-height:40px; padding:8px}
.ingrow .del{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--border);background:var(--card2);cursor:pointer;flex:none}
.doses{background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:10px 12px; font-size:13.5px; margin:8px 0}

/* ---------- sheet / overlay ---------- */
.overlay{
  position:fixed; inset:0; z-index:60; background:rgba(10,15,10,.45);
  display:flex; align-items:flex-end; justify-content:center; animation:fade .18s;
}
@keyframes fade{from{opacity:0}}
.sheet{
  position:relative; background:var(--card); width:100%; max-width:520px; max-height:88vh; overflow:auto;
  border-radius:22px 22px 0 0; padding:16px 16px calc(18px + env(safe-area-inset-bottom));
  animation:up .22s ease-out;
}
@keyframes up{from{transform:translateY(40px); opacity:.4}}
.sheet .grip{width:40px;height:4px;border-radius:99px;background:var(--border);margin:0 auto 12px}
.sheet h3{font-size:16px; margin-bottom:4px}
.full{border-radius:0; max-height:none; height:100%;}

/* ---------- fullscreen (timer / cucina) ---------- */
.fs{
  position:fixed; inset:0; z-index:70; background:var(--bg); display:flex; flex-direction:column;
  padding:calc(12px + env(safe-area-inset-top)) 16px calc(14px + env(safe-area-inset-bottom));
  max-width:520px; margin:0 auto; animation:fade .18s; overflow:auto;
}
.fs .fshead{display:flex; align-items:center; gap:10px; margin-bottom:8px}
.fs .fshead h3{font-size:16px}

/* ---------- timer ---------- */
.timerwrap{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-align:center}
.ring{position:relative; width:230px; height:230px}
.ring svg{transform:rotate(-90deg)}
.ring .innum{
  position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
}
.ring .innum b{font-size:56px; font-variant-numeric:tabular-nums; line-height:1}
.phase{font-size:13px; font-weight:800; letter-spacing:2px; color:var(--accent)}
.exname{font-size:22px; font-weight:800}
.exvar{font-size:14px; color:var(--muted); max-width:300px}
.nextex{font-size:12.5px; color:var(--muted)}
.timerctrl{display:flex; gap:12px; justify-content:center; margin:14px 0}
.tbtn{
  width:64px;height:64px; border-radius:50%; border:none; background:var(--accent); color:#fff;
  font-size:24px; cursor:pointer; display:flex;align-items:center;justify-content:center;
}
html[data-theme="dark"] .tbtn{color:#12160f}
.tbtn.sec{background:var(--chip); color:var(--text); width:52px;height:52px;font-size:19px}

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; transform:translateX(-50%) translateY(20px); bottom:calc(88px + env(safe-area-inset-bottom));
  background:var(--text); color:var(--bg); padding:11px 18px; border-radius:99px; font-size:13.5px; font-weight:600;
  opacity:0; pointer-events:none; transition:.25s; z-index:90; max-width:86vw; text-align:center;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0)}

/* ---------- misc ---------- */
.infobox{background:var(--soft); border:1px solid var(--soft2); border-radius:14px; padding:12px; font-size:13px}
.pillday{display:flex; gap:8px; align-items:baseline; justify-content:space-between; margin-bottom:6px}
details{margin-top:8px}
details summary{cursor:pointer; font-weight:700; font-size:13.5px; color:var(--accent2); padding:6px 0}
hr.th{border:none; border-top:1px solid var(--border); margin:12px 0}
.statgrid{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; text-align:center}
.statgrid .st{background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:10px 6px}
.statgrid b{font-size:20px; display:block}
.statgrid span{font-size:11px; color:var(--muted)}
.passirow{display:flex; gap:8px; align-items:center}
.passirow input{flex:1}

/* ---------- v2: calorie, profilo, tutorial ---------- */
input[type=range]{accent-color:var(--accent); width:100%; min-height:44px; background:transparent; border:none; padding:0}
.calval{font-size:34px; font-weight:800; text-align:center; font-variant-numeric:tabular-nums}
.calval small{font-size:13px; color:var(--muted); font-weight:600}
.calwarn{background:#fdf3e0; border:1px solid #efce9a; color:#8a5a00; border-radius:12px; padding:10px 12px; font-size:12.5px}
html[data-theme="dark"] .calwarn{background:#33291a; border-color:#5c4a22; color:#e8c37a}
.presets{display:flex; gap:8px}
.presets .btn{flex:1; min-width:0}
.exfig{width:min(300px,78vw); margin:2px auto 0}
.exfig svg,.exfig canvas{width:100%; height:auto; display:block}
.exfig canvas{color:var(--accent)}
.tutgrid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
.tutcard{background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:8px; cursor:pointer; text-align:center}
.tutcard svg,.tutcard canvas{width:100%; height:auto; color:var(--accent); display:block; border-radius:8px}
.tutcard b{display:block; font-size:11.5px; line-height:1.2; margin-top:4px; color:var(--text)}
.cue{display:flex; gap:8px; align-items:flex-start; padding:7px 0; border-bottom:1px dashed var(--border); font-size:13.5px}
.cue:last-child{border-bottom:none}
.cue .n{flex:none; width:22px; height:22px; border-radius:50%; background:var(--soft); color:var(--accent2); font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center}
.exrow{display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px dashed var(--border); cursor:pointer}
.exrow:last-child{border-bottom:none}
.exrow .en{flex:1; font-size:14px}
.exrow .go{color:var(--muted); font-size:12px}
.bmibox{display:flex; align-items:baseline; gap:10px}
.bmibox b{font-size:38px; font-variant-numeric:tabular-nums}
.kv{display:grid; grid-template-columns:auto 1fr; gap:5px 12px; font-size:13.5px}
.kv dt{color:var(--muted); font-weight:600}
.kv dd{margin:0; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
.deltalist{display:flex; gap:8px}
.deltalist .st{flex:1; background:var(--card2); border:1px solid var(--border); border-radius:12px; padding:8px 4px; text-align:center}
.deltalist b{font-size:16px; display:block}
.deltalist span{font-size:10.5px; color:var(--muted)}
.pesohist{max-height:180px; overflow:auto}
.pesohist .row{padding:7px 4px; cursor:default}
.chartbox{background:var(--card2); border:1px solid var(--border); border-radius:14px; padding:10px}
.obcard{display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center; padding:18px 14px}

/* ---------- a11y / touch ---------- */
.chip[data-act]{min-height:32px;display:inline-flex;align-items:center;gap:4px}
.sheet,.fs{overscroll-behavior:contain}
.vh{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <b>🔥 Breaking Fat</b>
    <span id="brandSub">Programma Batch Cooking Vegetariano · 1.250–1.300 kcal</span>
  </div>
  <h1 class="vh">Breaking Fat — Meal Prep e Movimento</h1>
  <div class="spacer"></div>
  <button class="iconbtn" data-act="theme" id="themeBtn" title="Tema" aria-label="Cambia tema">🌗</button>
  <button class="iconbtn" data-act="settings" title="Impostazioni" aria-label="Impostazioni">⚙️</button>
</header>

<main id="view"></main>

<nav class="tabbar">
  <div class="wrap">
    <button class="tabbtn on" data-act="tab" data-tab="oggi"><span class="ic">🏠</span>Oggi</button>
    <button class="tabbtn" data-act="tab" data-tab="pasti"><span class="ic">🍱</span>Pasti</button>
    <button class="tabbtn" data-act="tab" data-tab="spesa"><span class="ic">🛒</span>Spesa</button>
    <button class="tabbtn" data-act="tab" data-tab="cucina"><span class="ic">🍳</span>Cucina</button>
    <button class="tabbtn" data-act="tab" data-tab="mov"><span class="ic">🏋️</span>Gym</button>
    <button class="tabbtn" data-act="tab" data-tab="profilo"><span class="ic">👤</span>Profilo</button>
  </div>
</nav>

<div id="overlayRoot"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* =====================================================================
   BREAKING FAT — app singolo file (già "Piano Fatto da Te")
   Contenuti: Lista della Spesa Settimanale · Guida di Preparazione
   e Ricette · Piano di Attività Fisica Sostenibile + 8 nuove ricette.
   ===================================================================== */

/* ------------------------------ UTILS ------------------------------ */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* coercizione numerica per gli attributi value: mai stringhe grezze nel markup */
const numOr=(v,d=0)=>{const n=Number(v); return Number.isFinite(n)?n:d;};
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayISO=()=>iso(new Date());
const DOWK=['dom','lun','mar','mer','gio','ven','sab'];
const dowKey=(d=new Date())=>DOWK[d.getDay()];
const DOW_NAME={lun:'Lunedì',mar:'Martedì',mer:'Mercoledì',gio:'Giovedì',ven:'Venerdì',sab:'Sabato',dom:'Domenica'};
const DAYS=['lun','mar','mer','gio','ven'];
function mondayOfWeek(base=new Date()){const d=new Date(base); const off=(d.getDay()+6)%7; d.setDate(d.getDate()-off); d.setHours(0,0,0,0); return d;}
function dateOfWeekDay(k){
  const m=mondayOfWeek();
  const idx=DAYS.concat(['sab','dom']).indexOf(k);
  if(idx<0)return null;
  m.setDate(m.getDate()+idx); return m;
}

/* copia immutabile delle voci built-in: serve a ripulire i metadati personali
   ad azzeramento e import, senza perdere le voci originali del programma */
const ING_META_BASE=JSON.parse(JSON.stringify(ING_META));
function resetIngMeta(){
  Object.keys(ING_META).forEach(k=>{delete ING_META[k];});
  Object.assign(ING_META,JSON.parse(JSON.stringify(ING_META_BASE)));
}
/* applica i metadati salvati in stato: le voci built-in si sovrascrivono
   solo se marcate come personalizzate dall'utente (pers:true) */
function applyIngMeta(src){
  if(!src||typeof src!=='object')return;
  Object.entries(src).forEach(([n,m])=>{
    if(!m||typeof m!=='object'||typeof n!=='string')return;
    if(ING_META_BASE[n]&&!m.pers)return;
    ING_META[n]=JSON.parse(JSON.stringify(m));
  });
}

const isObj=o=>!!o&&typeof o==='object'&&!Array.isArray(o);
const str=(v,max,dflt='')=>typeof v==='string'?v.slice(0,max):(typeof v==='number'?String(v).slice(0,max):dflt);
const intIn=(v,min,max,dflt)=>{const n=Number(v); return Number.isFinite(n)?Math.min(max,Math.max(min,Math.round(n))):dflt;};
const numIn=(v,min,max,dflt)=>{const n=Number(v); return Number.isFinite(n)?Math.min(max,Math.max(min,n)):dflt;};
const isISO=v=>typeof v==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(v);
function sanitizeIngMeta(src){
  const out={};
  if(!isObj(src))return out;
  Object.keys(src).slice(0,2000).forEach(n=>{
    const m=src[n], name=str(n,120).trim();
    if(!name||!isObj(m))return;
    const e={c:intIn(m.c,0,CATS.length-1,CAT_DEF),gusto:!!m.gusto,pers:!!m.pers};
    if(['ml','pz'].includes(m.u))e.u=m.u;
    if(m.nota)e.nota=str(m.nota,200);
    if(m.kg)e.kg=true;
    if(isObj(m.pkg)){
      const sz=numIn(m.pkg.sz,1,1e5,null), pn=numIn(m.pkg.n,1,100,null);
      if(sz!=null&&pn!=null){
        e.pkg={n:pn,sz,sg:str(m.pkg.sg,60,'confezione'),pl:str(m.pkg.pl,60,'confezioni')};
        if(m.pkg.sgocc)e.pkg.sgocc=true;
        if(m.pkg.approx)e.pkg.approx=true;
      }
    }
    out[name]=e;
  });
  return out;
}
function sanitizeState(raw){
  const d=DEF();
  if(!isObj(raw))return d;
  const out={...d};
  out.v=APP_VERSION;
  /* piano: solo giorni feriali × pranzo/cena, id stringa corta o null */
  out.piano=JSON.parse(JSON.stringify(PIANO_DEFAULT));
  if(isObj(raw.piano))DAYS.forEach(day=>['pranzo','cena'].forEach(m=>{
    const v=isObj(raw.piano[day])?raw.piano[day][m]:null;

  }));
  /* ricette personali: struttura completa e tipi puliti */
  const ric=[], seen=new Set(RICETTE.concat([COLAZIONE]).map(r=>r.id));
  if(Array.isArray(raw.ricettePers)){
    raw.ricettePers.slice(0,200).forEach(r=>{
      if(!isObj(r))return;
      const ings=[];
      if(Array.isArray(r.ingredienti))r.ingredienti.slice(0,100).forEach(i=>{
        if(!isObj(i))return;
        const n=str(i.n,120).trim(); if(!n)return;
        const u=['g','ml','pz','q.b.'].includes(i.u)?i.u:'g';
        const ing={n,q:u==='q.b.'?0:numIn(i.q,0,1e5,null),u};
        if(Number.isFinite(Number(i.c)))ing.c=intIn(i.c,0,CATS.length-1,CAT_DEF);
        ings.push(ing);
      });
      if(!ings.length)return;
      const prep=[];
      if(Array.isArray(r.preparazione))r.preparazione.slice(0,200).forEach(s=>{
        const t=isObj(s)?str(s.t,500):str(s,500);
        if(t.trim())prep.push({m:isObj(s)&&['taglio','forno','pentola','tegame','fresco'].includes(s.m)?s.m:'tegame',t:t.trim()});
      });
      let id=str(r.id,40);
      if(!/^[A-Za-z0-9_-]{1,40}$/.test(id)||seen.has(id))id=uid();
      seen.add(id);
      ric.push({
        id, tipo:r.tipo==='cena'?'cena':'pranzo', origine:'personale',
        titolo:str(r.titolo,120).trim()||'Ricetta',
        short:str(r.short,40).trim()||shortName(str(r.titolo,120).trim()||'Ricetta'),
        kcal:intIn(r.kcal,0,5000,0), resa:intIn(r.resa,1,50,1),
        ingredienti:ings,
        preparazione:prep.length?prep:[{m:'tegame',t:'Preparazione a piacere.'}],
        porzione:str(r.porzione,120).trim()||'1 porzione',
        servizio:str(r.servizio,200).trim()||'Scalda e gusta.',
        cong:str(r.cong,200).trim()||'2-3 mesi. Scongela in frigo la sera prima.'
      });
    });
  }
  out.ricettePers=ric;
  /* mappe booleane generiche (spesa: nome articolo -> true) */
  const boolMap=(src,max,keyFn)=>{
    const o={};
    if(!isObj(src))return o;
    Object.keys(src).slice(0,max).forEach(k=>{
      if(k.length>200||(keyFn&&!keyFn(k)))return;
      if(src[k])o[k]=true;
    });
    return o;
  };
  const STEP_RE=/^[A-Za-z0-9_-]{1,40}:\d{1,3}$/;
  out.spesa=boolMap(raw.spesa,3000);
  out.steps=boolMap(raw.steps,3000,k=>STEP_RE.test(k));
  out.wo=boolMap(raw.wo,3000,isISO);
  /* pasti: iso -> {pranzo?,cena?} */
  out.pasti={};
  if(isObj(raw.pasti))Object.keys(raw.pasti).slice(0,2000).forEach(k=>{
    if(!isISO(k)||!isObj(raw.pasti[k]))return;
    const e={};
    if(raw.pasti[k].pranzo)e.pranzo=true;
    if(raw.pasti[k].cena)e.cena=true;
    if(Object.keys(e).length)out.pasti[k]=e;
  });
  /* passi: iso -> numero 0-200000 */
  out.passi={};
  if(isObj(raw.passi))Object.keys(raw.passi).slice(0,2000).forEach(k=>{
    if(!isISO(k))return;
    const n=numIn(raw.passi[k],0,200000,null);
    if(n!=null)out.passi[k]=n;
  });
  out.tema=['light','dark'].includes(raw.tema)?raw.tema:null;
  out.infoOk=!!raw.infoOk;
  out.calorie=numIn(raw.calorie,1000,2000,KCAL_BASE);
  out.obDone=!!raw.obDone;
  out.profilo=isObj(raw.profilo)?{
    nome:str(raw.profilo.nome,60),
    sesso:['F','M'].includes(raw.profilo.sesso)?raw.profilo.sesso:'',
    eta:intIn(raw.profilo.eta,14,99,null),
    altezza:numIn(raw.profilo.altezza,100,250,null),
    pesoObiettivo:numIn(raw.profilo.pesoObiettivo,30,300,null)
  }:null;
  out.pesi=Array.isArray(raw.pesi)
    ?raw.pesi.slice(0,2000).map(p=>isObj(p)&&isISO(p.d)&&numIn(p.kg,30,300,null)!=null?{d:p.d,kg:numIn(p.kg,30,300,null)}:null).filter(Boolean)
    :[];
  out.ingMeta=sanitizeIngMeta(raw.ingMeta);
  return out;
}

const fattore=()=>Math.max(.5,Math.min(2,S.calorie/KCAL_BASE));
const kcalAdapt=r=>Math.round(numOr(r.kcal,0)*fattore());
const kcalColazione=()=>Math.round(KCAL_COLAZ_SPUNTINI*fattore());

function streakWo(){

  while(S.wo[iso(d)]&&n<400){n++;d.setDate(d.getDate()-1);}

/* dose per porzione di un ingrediente: q è il totale per la resa */
/* --- pipeline quantità unica ---
   il totale (una infornata, o la somma della spesa) si arrotonda una sola volta:
   5 g/ml, uova intere. Le dosi a porzione derivano dal totale già arrotondato,
   così dose×resa e batch e spesa dicono la stessa cosa. */
const roundQ=g=>Math.round(g/5)*5;
const totQ=g=>g>0?Math.max(5,roundQ(g)):0;
const fmtDec=v=>{const x=Math.round(v*10)/10; return (''+x).replace('.',',');};
function dosePorzione(ing,resa,f){
  f=f==null?fattore():f;
  const q=+ing.q||0;
  const m=metaOf(ing.n);
  if(ing.q==null||ing.q===''||q===0||m.gusto||ing.u==='q.b.')return 'q.b.';
  const R=Math.max(1,resa);
  if(ing.n==='Uova fresche'){
    const v=Math.round(q*f)/R;
    return fmtDec(v)+(v===1?' uovo':' uova');
  }
  if(ing.u==='pz'||m.u==='pz')return fmtDec(Math.round(q*f)/R)+' pz';
  const tot=totQ(q*f);
  if(ing.u==='ml'||m.u==='ml')return fmtDec(tot/R)+' ml';
  return fmtDec(tot/R)+' g';
}
/* righe dose per una ricetta, usate nel dettaglio e nel picker */
function dosiHtml(r,f){
  f=f==null?fattore():f;
  return r.ingredienti.map(i=>`${esc(i.n)} ~<b>${esc(dosePorzione(i,r.resa,f))}</b>`).join(' · ');
}
/* ricette del piano con porzioni richieste e infornate (mult = ceil(slot/resa)) */
function batchPlan(){
  const counts={};
  DAYS.forEach(d=>['pranzo','cena'].forEach(m=>{const id=S.piano[d][m]; if(id)counts[id]=(counts[id]||0)+1;}));
  return Object.entries(counts).map(([id,n])=>{
    const r=byId(id); if(!r)return null;
    return {r,n,mult:Math.ceil(n/r.resa)};
  }).filter(Boolean);
}
/* quantità totale da cucinare di un ingrediente (stdQ = totale standard per le infornate) */
function batchIngQty(nome,stdQ,u,f){
  f=f==null?fattore():f;
  const m=metaOf(nome);
  if(u==='q.b.'||m.gusto||stdQ==null||stdQ===''||+stdQ===0)return 'q.b.';
  const ad=(+stdQ)*f;
  if(nome==='Uova fresche'){
    const v=Math.round(ad), s=v+' '+(v===1?'uovo':'uova');
    return v===6?s+' (1 confezione da 6)':s;
  }
  if(u==='pz'||m.u==='pz')return Math.round(ad)+' pz';
  if(u==='ml'||m.u==='ml')return totQ(ad)+' ml';
  return fmtQ(nome,totQ(ad),0,0);
}
/* box "quantità da cucinare" per la sessione batch, già adattate all'obiettivo */
function batchQtyHtml(){
  const plan=batchPlan();

}

/* ======================= AGGREGAZIONE SPESA ======================= */
function metaOf(n){
  return ING_META[n]||{c:CAT_DEF,gusto:false};
}
function fmtQ(nome,g,ml,pz){
  const m=metaOf(nome);
  if(m.gusto)return 'a piacere';
  if(nome==='Uova fresche'){const n=Math.round(pz); return n+' '+(n===1?'uovo':'uova')+(n===6?' (1 confezione da 6)':'');}
  if(m.u==='pz')return Math.round(pz)+' pz';
  if(m.pkg){
    const p=m.pkg, n=Math.max(1,Math.ceil(g/p.sz));
    switch(nome){
      case 'Passata di pomodoro':return Math.round(g)+' g ('+n+' '+(n>1?'bottiglie':'bottiglia')+')';
      case 'Broccoli / Cavolfiore':return n+' '+(n>1?'ceppi':'ceppo')+' (~'+Math.round(g)+' g)';
      case 'Mais dolce':return n+' '+(n>1?'lattine piccole':'lattina piccola')+' ('+Math.round(g)+' g sgocc.)';
      case 'Crostini integrali':return n+' '+(n>1?'confezioni':'confezione');
      default:{
        let s=n+' '+(n>1?p.pl:p.sg);
        if(p.sgocc)s+=' ('+Math.round(g)+' g sgocc.)';
        return s;
      }
    }
  }
  if(m.kg)return g<500?Math.round(g)+' g totali':'~'+(g/1000).toFixed(1).replace('.',',')+' kg totali';
  if(m.u==='ml')return Math.round(ml)+' ml';
  return Math.round(g)+' g';
}
/* Calcola la lista spesa dal piano corrente.
   Ritorna [{nome, cat, q, opz, nota}] */
function computeSpesa(){
  const map=new Map();
  const note={}; // nome -> nota preferita
  // 'Carote' e 'Zucca o Carote' sono lo stesso articolo della spesa
  const canon=n=>n==='Carote'?'Zucca o Carote':n;
  const add=(nome0,q,nota)=>{
    const nome=canon(nome0);
    let it=map.get(nome);
    if(!it){it={nome,g:0,ml:0,pz:0};map.set(nome,it);}
    const m=metaOf(nome);
    if(m.u==='ml')it.ml+=q; else if(m.u==='pz')it.pz+=q; else if(!m.gusto)it.g+=q||0;
    if(nota&&!note[nome])note[nome]=nota;
  };
  COLAZIONE.ingredienti.forEach(i=>add(i.n,i.q||0,i.nota));
  SPESA_FISSA.forEach(f=>{ if(!f.opz)add(f.n,f.q||0,f.q===0?null:f.nota); });

  // ricette nel piano: multiplo = ceil(slot / resa)
  const counts={};
  DAYS.forEach(d=>['pranzo','cena'].forEach(m=>{const id=S.piano[d][m]; if(id)counts[id]=(counts[id]||0)+1;}));
  Object.entries(counts).forEach(([id,n])=>{
    const r=byId(id); if(!r)return;
    const mult=Math.ceil(n/r.resa);
    r.ingredienti.forEach(i=>add(i.n,(i.q||0)*mult,i.nota));
  });

  const OPZ_DEFAULT=new Map(SPESA_FISSA.filter(f=>f.opz).map(f=>[f.n,f.q||0]));
  const f=fattore();
  // stessi arrotondamenti della pipeline quantità: g/ml a 5, pezzi a interi
  const sc=g=>totQ(g*f);
  const scPz=p=>p>0?Math.max(1,Math.round(p*f)):0;
  const items=[...map.values()].map(it=>{
    const m=metaOf(it.nome);
    return {nome:it.nome, m, g:sc(it.g), ml:m.u==='ml'?sc(it.ml):0, pz:scPz(it.pz)};
  // niente righe fantasma "0 g" o "1 confezione" per quantità a zero
  }).filter(x=>x.m.gusto||x.g>0||x.ml>0||x.pz>0)
    .map(x=>({
      nome:x.nome, cat:(x.m.c??CAT_DEF),
      q:fmtQ(x.nome,x.g,x.ml,x.pz),
      opz:false,
      nota:note[x.nome]||x.m.nota||''
    }));
  // articoli opzionali: mostrati solo se non già coperti da una ricetta
  OPZ_DEFAULT.forEach((qsug,nome)=>{
    if(map.has(nome))return;
    const m=metaOf(nome);
    if(!(qsug>0)&&!m.gusto)return;
    items.push({nome,cat:m.c??CAT_DEF,q:fmtQ(nome,qsug,m.u==='ml'?qsug:0,qsug),opz:true,
      nota:(SPESA_FISSA.find(x=>x.n===nome)||{}).nota||''});
  });
  items.sort((a,b)=>a.cat-b.cat||(a.opz?1:0)-(b.opz?1:0));
  return items;
}
function spesaTotali(){
  const items=computeSpesa().filter(i=>!i.opz);
  const done=items.filter(i=>S.spesa[i.nome]).length;
  return {done,tot:items.length};
}

function renderSpesa(){

  const pct=Math.round(done/real.length*100);
  let html=`

    html+=`<div class="card" data-cat="${ci}">

function slotBtn(d,m){

  </button>`;

function sessioneSteps(){
  /* costruisce la check-list della sessione dalle ricette nel piano */
  const counts={};
  DAYS.forEach(d=>['pranzo','cena'].forEach(m=>{const id=S.piano[d][m]; if(id)counts[id]=(counts[id]||0)+1;}));
  const ORDER={taglio:0,forno:1,pentola:2,tegame:3,fresco:4};
  const GROUP={taglio:'🔪 Taglio & Preparazione',forno:'🔥 Forno',pentola:'🍲 Pentole',tegame:'🍳 Tegami',fresco:'📦 Assemblaggio & Finishing'};
  const list=[];
  Object.entries(counts).forEach(([id,n])=>{
    const r=byId(id); if(!r)return;
    const mult=Math.ceil(n/r.resa);
    r.preparazione.forEach((st,i)=>list.push({key:id+':'+i,m:st.m,who:r.short||r.titolo,mult,t:st.t}));
  });
  list.sort((a,b)=>(ORDER[a.m]??9)-(ORDER[b.m]??9));
  const groups={};
  list.forEach(s=>{(groups[s.m]=groups[s.m]||[]).push(s);});
  const ricLine=Object.entries(counts).map(([id,n])=>{
    const r=byId(id); if(!r)return '';
    const mult=Math.ceil(n/r.resa);
    return `<span class="chip">${esc(r.short||r.titolo)} · ${n} porz.${mult>1?' · doppia infornata':''}</span>`;
  }).join(' ');
  const totDone=list.filter(s=>S.steps[s.key]).length;
  let html=`<p class="small" style="margin:4px 0 8px">${ricLine}</p>`;
  html+=`<div class="pillday" style="margin-top:4px"><b class="small">✅ Check-list sessione</b><span class="tiny muted" id="sessTotal">${totDone}/${list.length} passi</span></div>`;
  Object.keys(GROUP).forEach(g=>{
    if(!groups[g])return;
    const arr=groups[g];
    const dn=arr.filter(s=>S.steps[s.key]).length;
    html+=`<div class="sessgroup"><div class="pillday" style="margin-top:10px"><b class="small">${GROUP[g]}</b><span class="tiny muted">${dn}/${arr.length}</span></div>`;
    html+=arr.map(s=>`
      <button type="button" class="row asbtn ${S.steps[s.key]?'done':''}" data-act="step" data-k="${esc(s.key)}" aria-pressed="${S.steps[s.key]?'true':'false'}">
        <div class="tick">✓</div>
        <div class="rtext"><b style="font-size:13.5px">${esc(s.t)}</b><span class="q">${esc(s.who)}</span></div>
      </button>`).join('')+'</div>';
  });
  return html;
}
function updateStepUI(key){
  const row=document.querySelector('main .row[data-k="'+key.replace(/["\\]/g,'\\$&')+'"]');
  if(!row)return;
  row.classList.toggle('done',!!S.steps[key]);
  const grp=row.closest('.sessgroup');
  if(grp){
    const sub=grp.querySelector('.pillday .tiny');
    const rows=[...grp.querySelectorAll('.row')];
    if(sub)sub.textContent=rows.filter(r=>r.classList.contains('done')).length+'/'+rows.length;
  }
  const tot=document.getElementById('sessTotal');
  if(tot){
    const all=[...document.querySelectorAll('main .row[data-act="step"]')];
    tot.textContent=all.filter(r=>r.classList.contains('done')).length+'/'+all.length+' passi';
  }

/* --- motore di animazione --- */
const AC={body:'#4E5DEE',far:'#3944B5',shorts:'#2C357E',shoe:'#252E42',hair:'#232A4D',
  shadow:'rgba(30,40,90,.17)',ground:'rgba(120,132,190,.45)'};
const SEG={torso:50,neck:7,headR:12.5,ua:32,fa:30,thigh:45,shin:42,foot:13,
  rHip:12,rChest:10.2,rUA:6.6,rFA:5.4,rThigh:9.4,rShin:6.6,rHand:4.6,rFoot:4.8};
const RD=d=>d*Math.PI/180;
const LP=(a,b,u)=>a+(b-a)*u;
const BASE={x:0,y:91,t:3,h:-2,bend:0,af:[10,12],ab:[-9,11],lf:[4,6],lb:[-3,5],Af:[4,5,90],Ab:[-4,5,90]};
const PZ=o=>Object.assign({},BASE,o);
function interpPose(a,b,u){
  const o={};
  for(const k in a){
    if(Array.isArray(a[k]))o[k]=a[k].map((v,i)=>b[k]&&b[k][i]!=null?LP(v,b[k][i],u):v);
    else o[k]=(b&&k in b)?LP(a[k],b[k],u):a[k];
  }
  /* passo con arco: il piede si solleva quando si sposta in orizzontale */
  ['Af','Ab'].forEach(k=>{if(a[k]&&b[k]&&Math.abs(a[k][0]-b[k][0])>25)o[k][1]+=16*Math.sin(Math.PI*u);});
  return o;
}
const easeIO=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function poseAt(a,now){
  const n=a.k.length;
  if(n===1)return a.k[0];
  if(a.cyc){
    const fi=((now/a.d)%1)*(n-1),i0=Math.min(n-2,Math.floor(fi)),f=fi-i0;
    return interpPose(a.k[i0],a.k[i0+1],a.lin?f:easeIO(f));
  }
  const u=(now/a.d)%2,kx=easeIO(u<1?u:2-u)*(n-1),i0=Math.min(n-2,Math.floor(kx));
  return interpPose(a.k[i0],a.k[i0+1],kx-i0);
}
/* IK a due segmenti: angolo (da "giù", + = avanti) del primo segmento */
function ik(B,T,L1,L2,sg){
  const dx=T[0]-B.x,dy=T[1]-B.y;
  const d=Math.min(L1+L2-.05,Math.max(Math.abs(L1-L2)+.05,Math.hypot(dx,dy)));
  const c=Math.max(-1,Math.min(1,(L1*L1+d*d-L2*L2)/(2*L1*d)));
  return Math.atan2(dx,-dy)+sg*Math.acos(c);
}
function chain(B,T,L1,L2,sg){
  const a1=ik(B,T,L1,L2,sg),m={x:B.x+L1*Math.sin(a1),y:B.y-L1*Math.cos(a1)};
  const a2=Math.atan2(T[0]-m.x,-(T[1]-m.y));
  return {a1,a2,m,e:{x:m.x+L2*Math.sin(a2),y:m.y-L2*Math.cos(a2)}};
}

/* cinematica (coordinate: x avanti, y in su, suolo y=0) */
function fkSide(p){
  const tv=RD(p.t),P={x:p.x||0,y:p.y};
  const chest={x:P.x+SEG.torso*Math.sin(tv),y:P.y+SEG.torso*Math.cos(tv)};
  const hv=RD(p.t+p.h);
  const head={x:chest.x+(SEG.neck+SEG.headR)*Math.sin(hv),y:chest.y+(SEG.neck+SEG.headR)*Math.cos(hv)};
  const sh={x:chest.x-3*Math.sin(tv),y:chest.y-3*Math.cos(tv)};
  const arm=(a,W)=>{
    let s,e,el,wr;
    if(W){const c=chain(sh,W,SEG.ua,SEG.fa,-1);s=c.a1;e=c.a2;el=c.m;wr=c.e;}
    else{s=RD(a[0]);e=RD(a[0]+a[1]);
      el={x:sh.x+SEG.ua*Math.sin(s),y:sh.y-SEG.ua*Math.cos(s)};
      wr={x:el.x+SEG.fa*Math.sin(e),y:el.y-SEG.fa*Math.cos(e)};}
    return {el,wr,hd:{x:wr.x+9*Math.sin(e),y:wr.y-2*Math.cos(e)}};
  };
  const leg=(l,T)=>{
    let kn,an;
    if(T){const c=chain(P,T,SEG.thigh,SEG.shin,1);kn=c.m;an=c.e;}
    else{const hp=RD(l[0]),sk=RD(l[0]-l[1]);
      kn={x:P.x+SEG.thigh*Math.sin(hp),y:P.y-SEG.thigh*Math.cos(hp)};
      an={x:kn.x+SEG.shin*Math.sin(sk),y:kn.y-SEG.shin*Math.cos(sk)};}
    const ft=RD(T&&T[2]!=null?T[2]:l[0]-l[1]+85);
    return {kn,an,to:{x:an.x+SEG.foot*Math.sin(ft),y:an.y-SEG.foot*Math.cos(ft)}};
  };
  return {P,chest,head,sh,af:arm(p.af,p.Wf),ab:arm(p.ab,p.Wb),lf:leg(p.lf,p.Af),lb:leg(p.lb,p.Ab)};
}
function fkFront(p){
  const P={x:0,y:p.y},chest={x:0,y:P.y+SEG.torso},hT=p.hT||0,hv=RD(hT);
  const head={x:(SEG.neck+SEG.headR)*Math.sin(hv),y:chest.y+(SEG.neck+SEG.headR)*Math.cos(hv)};
  const sw=SEG.rChest+3.5;
  const armS=(a,s,W)=>{
    const sh={x:chest.x+s*sw,y:chest.y-2};
    let q=RD(a[0]),e=RD(a[0]+a[1]);
    if(W){const T=[s*(W[0]-sh.x),W[1]-sh.y];q=ik({x:0,y:0},T,SEG.ua,SEG.fa,-1);
      const ex=SEG.ua*Math.sin(q),ey=-SEG.ua*Math.cos(q);e=Math.atan2(T[0]-ex,-(T[1]-ey));}
    const el={x:sh.x+s*SEG.ua*Math.sin(q),y:sh.y-SEG.ua*Math.cos(q)};
    const wr={x:el.x+s*SEG.fa*Math.sin(e),y:el.y-SEG.fa*Math.cos(e)};
    return {sh,el,wr};
  };
  const legS=(l,s)=>{const q=RD(l[0]),e=RD(l[0]+(l[1]||0));
    const hp={x:P.x+s*(SEG.rHip-2),y:P.y};
    const kn={x:hp.x+s*SEG.thigh*Math.sin(q),y:hp.y-SEG.thigh*Math.cos(q)};
    const an={x:kn.x+s*SEG.shin*Math.sin(e),y:kn.y-SEG.shin*Math.cos(e)};
    return {hp,kn,an};};
  return {P,chest,head,hT,aL:armS(p.aL,-1,p.WL),aR:armS(p.aR,1,p.WR),lL:legS(p.lL,-1),lR:legS(p.lR,1)};
}
function joints(J,front){
  const p=[J.P,J.chest,J.head];
  if(front){[J.aL,J.aR].forEach(x=>p.push(x.sh,x.el,x.wr));[J.lL,J.lR].forEach(x=>p.push(x.hp,x.kn,x.an));}
  else{p.push(J.sh);[J.af,J.ab].forEach(x=>p.push(x.el,x.wr,x.hd));[J.lf,J.lb].forEach(x=>p.push(x.kn,x.an,x.to));}
  return p;
}
/* inquadratura FISSA per esercizio: calcolata una volta su tutto il ciclo,
   così la figura non cambia scala né salta mentre si muove */
function frameOf(a,front){
  if(a._fr)return a._fr;
  let x0=1e9,x1=-1e9,y1=0;
  const T=a.cyc?a.d:2*a.d;
  for(let i=0;i<48;i++){
    joints((front?fkFront:fkSide)(poseAt(a,T*i/48)),front).forEach(q=>{
      x0=Math.min(x0,q.x);x1=Math.max(x1,q.x);y1=Math.max(y1,q.y);});
  }
  if(a.wall)x1=Math.max(x1,a.wall+4);
  return a._fr={x0:x0-13,x1:x1+13,y1:y1+13};
}

/* primitive di disegno */
function cap(ctx,x1,y1,x2,y2,r1,r2,fill){
  const a=Math.atan2(y2-y1,x2-x1),hp=Math.PI/2;
  if(r1<0.4||r2<0.4)return;
  ctx.fillStyle=fill;ctx.beginPath();
  ctx.arc(x1,y1,r1,a+hp,a-hp);
  ctx.arc(x2,y2,r2,a-hp,a+hp);
  ctx.closePath();ctx.fill();
}
function limb(ctx,pts,rs,fill){
  for(let i=0;i<pts.length-1;i++)
    cap(ctx,pts[i][0],pts[i][1],pts[i+1][0],pts[i+1][1],rs[i],rs[i+1],fill);
}
function torsoSide(ctx,P,chest,bend,fill,M){
  const mx=(P.x+chest.x)/2,my=(P.y+chest.y)/2;
  const dl0=Math.hypot(chest.x-P.x,chest.y-P.y)||1,dx0=(chest.x-P.x)/dl0,dy0=(chest.y-P.y)/dl0;
  const c={x:mx-bend*dy0,y:my+bend*dx0};
  const N=14,Ls=[],Rs=[];
  for(let i=0;i<=N;i++){const t=i/N,u=1-t;
    const bx=u*u*P.x+2*u*t*c.x+t*t*chest.x;
    const by=u*u*P.y+2*u*t*c.y+t*t*chest.y;
    const w=LP(SEG.rHip,SEG.rChest,Math.sin(t*Math.PI/2));
    const ddx=2*u*(c.x-P.x)+2*t*(chest.x-c.x);
    const ddy=2*u*(c.y-P.y)+2*t*(chest.y-c.y);
    const dl=Math.hypot(ddx,ddy)||1;
    const nx=(-ddy/dl)*w,ny=(ddx/dl)*w;
    Ls.push(M({x:bx+nx,y:by+ny}));
    Rs.push(M({x:bx-nx,y:by-ny}));
  }
  ctx.fillStyle=fill;ctx.beginPath();
  Ls.forEach((q,i)=>i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]));
  Rs.reverse().forEach(q=>ctx.lineTo(q[0],q[1]));
  ctx.closePath();ctx.fill();
}
function headSide(ctx,hx,hy,tilt,fill,sc){
  ctx.save();ctx.translate(hx,hy);ctx.rotate(tilt);
  const r=SEG.headR*sc;
  ctx.fillStyle=fill;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill();
  ctx.strokeStyle=AC.hair;ctx.lineWidth=r*.62;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(0,0,r*.72,RD(150),RD(325));ctx.stroke();
  ctx.fillStyle=fill;ctx.beginPath();ctx.arc(r*.92,r*.1,r*.2,0,7);ctx.fill();
  ctx.restore();
}
function drawAnim(ctx,W,H,ex,now){
  const a=ANIM[ex];if(!a)return;
  const front=a.v==='f';
  const pose=Object.assign({},poseAt(a,now));
  pose.t=(pose.t||0)+Math.sin(now/650);            // respiro
  const J=(front?fkFront:fkSide)(pose);
  const fr=frameOf(a,front),padT=4,padB=6;
  const bw=Math.max(60,fr.x1-fr.x0),bh=Math.max(60,fr.y1);
  const sc=Math.min((W-8)/bw,(H-padT-padB)/bh);
  const gy=H-padB,cx=(W-bw*sc)/2-fr.x0*sc;
  const M=q=>[cx+q.x*sc,gy-q.y*sc];
  // suolo e ombra
  ctx.strokeStyle=AC.ground;ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(6,gy+1);ctx.lineTo(W-6,gy+1);ctx.stroke();
  const midX=M({x:J.P.x,y:0})[0],shw=Math.max(14,bw*sc*.28);
  ctx.save();ctx.translate(midX,gy);ctx.scale(1,.14);
  const grad=ctx.createRadialGradient(0,0,2,0,0,shw);
  grad.addColorStop(0,AC.shadow);grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;ctx.beginPath();ctx.arc(0,0,shw,0,7);ctx.fill();ctx.restore();
  // muro
  if(a.wall){
    const wx=M({x:a.wall,y:0})[0];
    ctx.strokeStyle=AC.ground;ctx.lineWidth=4;
    ctx.beginPath();ctx.moveTo(wx,4);ctx.lineTo(wx,gy+1);ctx.stroke();
    ctx.lineWidth=1.5;ctx.globalAlpha=.5;
    for(let yy=14;yy<gy-6;yy+=13){ctx.beginPath();ctx.moveTo(wx+2,yy);ctx.lineTo(wx+8,yy-7);ctx.stroke();}
    ctx.globalAlpha=1;
  }
  const scMul=v=>v*sc;
  if(front){
    const armF=(ar,c)=>{limb(ctx,[M(ar.sh),M(ar.el),M(ar.wr)],
      [SEG.rUA,SEG.rUA*.82,SEG.rFA*.9].map(scMul),c);
      cap(ctx,M(ar.wr)[0],M(ar.wr)[1],M(ar.wr)[0],M(ar.wr)[1],SEG.rHand*sc,SEG.rHand*sc,c);};
    // lato lontano (destro), busto, testa, lato vicino
    armF(J.aR,AC.far);
    limb(ctx,[M(J.lR.hp),M(J.lR.kn),M(J.lR.an)],[9.8,7,4.4].map(scMul),AC.far);
    cap(ctx,M(J.lR.an)[0],M(J.lR.an)[1],M(J.lR.an)[0],M(J.lR.an)[1]+5*sc,SEG.rFoot*sc,SEG.rFoot*.8*sc,AC.shoe);
    torsoSide(ctx,J.P,J.chest,0,AC.body,M);
    cap(ctx,M(J.P)[0],M(J.P)[1],M(J.P)[0],M(J.P)[1],(SEG.rHip+1)*sc,(SEG.rHip+1)*sc,AC.shorts);
    cap(ctx,M(J.chest)[0],M(J.chest)[1],M(J.head)[0],M(J.head)[1],4.8*sc,4.4*sc,AC.body);
    const [hx,hy]=M(J.head);
    ctx.save();ctx.translate(hx,hy);ctx.rotate(RD(J.hT));
    ctx.fillStyle=AC.body;ctx.beginPath();ctx.arc(0,0,SEG.headR*sc,0,7);ctx.fill();
    ctx.strokeStyle=AC.hair;ctx.lineWidth=SEG.headR*sc*.55;ctx.lineCap='round';
    ctx.beginPath();ctx.arc(0,0,SEG.headR*sc*.7,RD(205),RD(335));ctx.stroke();
    ctx.restore();
    armF(J.aL,AC.body);
    limb(ctx,[M(J.lL.hp),M(J.lL.kn),M(J.lL.an)],[9.8,7,4.4].map(scMul),AC.body);
    cap(ctx,M(J.lL.an)[0],M(J.lL.an)[1],M(J.lL.an)[0],M(J.lL.an)[1]+5*sc,SEG.rFoot*sc,SEG.rFoot*.8*sc,AC.shoe);
  }else{
    const legD=(lg,c)=>{
      const cm={x:lg.kn.x+(lg.an.x-lg.kn.x)*.3,y:lg.kn.y+(lg.an.y-lg.kn.y)*.3};
      const sm={x:J.P.x+(lg.kn.x-J.P.x)*.5,y:J.P.y+(lg.kn.y-J.P.y)*.5};
      limb(ctx,[M(J.P),M(lg.kn),M(cm),M(lg.an)],[10.2,7,7.4,4.2].map(scMul),c);
      cap(ctx,M(J.P)[0],M(J.P)[1],M(sm)[0],M(sm)[1],11*sc,8.6*sc,AC.shorts);
      cap(ctx,M(lg.an)[0],M(lg.an)[1],M(lg.to)[0],M(lg.to)[1],4.9*sc,3.4*sc,AC.shoe);};
    // arti lontani
    limb(ctx,[M(J.sh),M(J.ab.el),M(J.ab.wr),M(J.ab.hd)],
      [SEG.rUA*.9,SEG.rUA*.72,SEG.rFA*.8,SEG.rHand*.9].map(scMul),AC.far);
    legD(J.lb,AC.far);
    // busto
    torsoSide(ctx,J.P,J.chest,pose.bend||0,AC.body,M);
    cap(ctx,M(J.P)[0],M(J.P)[1],M(J.P)[0],M(J.P)[1],SEG.rHip*sc,SEG.rHip*sc,AC.shorts);
    // arti vicini
    legD(J.lf,AC.body);
    limb(ctx,[M(J.sh),M(J.af.el),M(J.af.wr),M(J.af.hd)],
      [SEG.rUA,SEG.rUA*.8,SEG.rFA*.85,SEG.rHand].map(scMul),AC.body);
    // collo e testa
    cap(ctx,M(J.chest)[0],M(J.chest)[1],M(J.head)[0],M(J.head)[1],4.8*sc,4.4*sc,AC.body);
    headSide(ctx,M(J.head)[0],M(J.head)[1],RD(pose.t+(pose.h||0))*-1,AC.body,sc);
  }
}

/* registro canvas + ciclo unico */
const REDUCED=matchMedia('(prefers-reduced-motion: reduce)');
const ANIM_LIVE=new Map();
const ANIM_IO=('IntersectionObserver'in window)?new IntersectionObserver(es=>{
  es.forEach(e=>{const st=ANIM_LIVE.get(e.target);if(st)st.vis=e.isIntersecting;});
},{rootMargin:'80px'}):null;
function mountAnim(el,h){
  const ex=el.dataset.an;
  if(!ANIM[ex])return;
  const cv=document.createElement('canvas');
  const w=Math.max(140,Math.round(el.getBoundingClientRect().width||260));
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=w*dpr;cv.height=h*dpr;
  cv.style.width='100%';cv.style.height=h+'px';cv.style.display='block';
  el.appendChild(cv);
  ANIM_LIVE.set(cv,{ex,w,h,dpr,vis:true,last:0,t0:performance.now(),inOverlay:!!cv.closest('#overlayRoot'),ctx:cv.getContext('2d')});
  ANIM_IO&&ANIM_IO.observe(cv);
  // reduced motion: disegna un solo frame statico (posa iniziale, now=0)
  if(REDUCED.matches){const ctx=cv.getContext('2d');ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,w,h);drawAnim(ctx,w,h,ex,0);}
}
function mountAnims(root){
  (root||document).querySelectorAll('[data-an]').forEach(el=>{
    if(el._anMount)return;
    el._anMount=true;
    mountAnim(el,parseInt(el.dataset.anH||'150'));
  });
}
(function animLoop(){
  requestAnimationFrame(animLoop);
  const now=performance.now();
  const ov=$('#overlayRoot'), overlayOpen=ov&&ov.firstElementChild;
  ANIM_LIVE.forEach((st,cv)=>{
    if(!cv.isConnected){ANIM_LIVE.delete(cv);ANIM_IO&&ANIM_IO.unobserve(cv);return;}
    if(REDUCED.matches)return; // il frame statico resta sullo schermo
    if(overlayOpen&&!st.inOverlay)return; // canvas coperta da overlay: skip
    if(!st.vis||now-st.last<33)return;
    st.last=now;
    const cw=Math.round(cv.clientWidth);
    if(cw>40&&cw!==st.w){st.w=cw;cv.width=cw*st.dpr;}
    const ctx=st.ctx;
    ctx.setTransform(st.dpr,0,0,st.dpr,0,0);
    ctx.clearRect(0,0,st.w,st.h);
    drawAnim(ctx,st.w,st.h,st.ex,now-st.t0);
  });
})();

/* ============================ SHEET & OVERLAY ============================ */
/* render differito: non sostituire il DOM mentre è in corso un'interazione
   (mousedown → change → click: un render sincrono perderebbe il click) */
let _renderQueued=false,_renderSeq=0;
function renderSoon(){
  if(_renderQueued)return;
  const seq=_renderSeq;
  _renderQueued=true;
  setTimeout(()=>{_renderQueued=false; if(_renderSeq===seq)render();},0);
}
function stopTimers(){
  try{if(typeof TM!=='undefined'&&TM){clearInterval(TM.int);TM.running=false;TM=null;}}catch(e){}
}
function closeOverlay(){
  stopTimers();
  const r=$('#overlayRoot'); r.innerHTML='';
  releaseWake();
  // scudo anti doppio-tap: il secondo tap non deve ricadere sulla tab sottostante
  window._shieldUntil=Date.now()+400;
  renderSoon();
  window._confCb=null;
  const lf=window._lastFocus; window._lastFocus=null;
  if(lf&&lf.isConnected){try{lf.focus();}catch(e){}}
}
function openSheet(html,cls=''){
  $('#overlayRoot').innerHTML=`<div class="overlay" data-act="backdrop">
    <div class="sheet ${cls}" data-stop role="dialog" aria-modal="true">
      <div class="grip"></div><button type="button" class="xbtn asbtn" data-act="close" aria-label="Chiudi">✕</button>${html}
    </div></div>`;
  window._lastFocus=document.activeElement;
  mountAnims($('#overlayRoot'));
  requestAnimationFrame(()=>{const x=$('#overlayRoot .xbtn');x&&x.focus();});
}

function kcalSuggerite(){
  const p=ultimoPeso(); if(!p||!S.profilo||!S.profilo.eta||!S.profilo.altezza)return null;
  const bmr=bmrCalc(p.kg);
  const sug=Math.round((bmr*1.3-400)/25)*25;
  return Math.max(1000,Math.min(2000,sug));
}
/* TDEE stimato (mantenimento): Mifflin-St Jeor ×1,3, fallback su obiettivo+400.
   Il weekend libero deve restare sotto questa soglia per non ingrassare. */
function tdeeStima(){
  const p=ultimoPeso();
  const b=p?bmrCalc(p.kg):null;
  if(b)return Math.round(b*1.3/25)*25;
  return Math.round((S.calorie+400)/25)*25;
}
function tdeeAffidabile(){
  const p=ultimoPeso();
  return !!(p&&bmrCalc(p.kg));
}

/* --- profilo: peso, BMI, metabolismo --- */
function ultimoPeso(){if(!S.pesi.length)return null;const a=S.pesi.slice().sort((x,y)=>x.d<y.d?-1:x.d>y.d?1:0);return a[a.length-1];}
function bmiCalc(kg){
  if(!S.profilo||!S.profilo.altezza)return null;
  const h=S.profilo.altezza/100;
  return kg/(h*h);
}
function bmiCat(bmi){
  if(bmi<18.5)return{t:'Sottopeso',cls:'warn'};
  if(bmi<25)return{t:'Normopeso',cls:'ok'};
  if(bmi<30)return{t:'Sovrappeso',cls:'warn'};
  return{t:'Obesità',cls:'warn'};
}
function bmrCalc(kg){
  const p=S.profilo;
  if(!p||!p.eta||!p.altezza)return null;
  return 10*kg+6.25*p.altezza-5*p.eta+(p.sesso==='M'?5:-161);
}
const nf=v=>{const n=Number(v); return Number.isFinite(n)?n.toLocaleString('it-IT',{maximumFractionDigits:1}):'—';};
function pesoChartSvg(){
  const pts=S.pesi.slice().sort((a,b)=>a.d<b.d?-1:1);
  if(pts.length<2)return `<div style="padding:26px 8px;text-align:center" class="tiny muted">📏 Registra almeno due pesi per vedere l'andamento.</div>`;
  const W=320,H=130,P=26;
  const kgs=pts.map(p=>p.kg);
  const mn=Math.min(...kgs)-.6, mx=Math.max(...kgs)+.6;
  const X=i=>P+(W-2*P)*(pts.length===1?.5:i/(pts.length-1));
  const Y=kg=>P+(H-2*P)*(1-(kg-mn)/(mx-mn));
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.kg).toFixed(1)).join(' ');
  const area=line+` L${X(pts.length-1).toFixed(1)} ${H-P} L${X(0).toFixed(1)} ${H-P} Z`;
  const last=pts[pts.length-1], first=pts[0];
  const minP=pts.reduce((a,b)=>b.kg<a.kg?b:a), maxP=pts.reduce((a,b)=>b.kg>a.kg?b:a);
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">
    <path d="${area}" fill="var(--accent)" opacity=".12"/>
    <path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${X(pts.length-1)}" cy="${Y(last.kg)}" r="4.5" fill="var(--accent)"/>
    <text x="${X(pts.length-1)-6}" y="${Y(last.kg)-9}" font-size="11" font-weight="700" fill="var(--accent)" text-anchor="end">${nf(last.kg)} kg</text>
    <text x="${X(0)}" y="${Y(first.kg)-9}" font-size="10" fill="var(--muted)" text-anchor="start">${first.d.slice(8,10)}/${first.d.slice(5,7)}</text>
    <text x="${X(minP===last?pts.length-1:pts.indexOf(minP))}" y="${Math.min(H-4,Y(minP.kg)+13)}" font-size="9.5" fill="var(--muted)" text-anchor="middle">min ${nf(minP.kg)}</text>
    <text x="${X(pts.indexOf(maxP))}" y="${Math.max(10,Y(maxP.kg)-8)}" font-size="9.5" fill="var(--muted)" text-anchor="middle">max ${nf(maxP.kg)}</text>
  </svg>`;
}
function deltaPesi(){
  const pts=S.pesi.slice().sort((a,b)=>a.d<b.d?-1:1);
  if(!pts.length)return null;
  const last=pts[pts.length-1].kg;
  const cut=iso(new Date(Date.now()-7*864e5));
  const base=[...pts].reverse().find(p=>p.d<=cut);
  const d7=base?last-base.kg:null;
  return {ultimo:last,primo:pts[0].kg,dTot:last-pts[0].kg,d7};
}

/* ============================ TIMER ROUTINE ============================ */
let TM=null;
function buildPhases(r){
  const ph=[];
  const ex=r.esercizi||[];
  const giri=r.giri||2, lavoro=r.lavoro||40, pausa=r.pausa||20;
  for(let g=1;g<=giri;g++){
    ex.forEach((e,i)=>{
      ph.push({type:'work',sec:lavoro,ex:e,giro:g,pos:i+1,tot:ex.length});
      const isLast=i===ex.length-1;
      if(!(isLast&&g===giri))ph.push({type:'rest',sec:pausa,label:r.restLabel||'Pausa',next:ex[i+1]||ex[0],giro:g});
    });
    if(g<giri)ph.push({type:'rest',sec:60,label:'Riposo tra i giri',next:ex[0],giro:g});
  }
  // timeline assoluta: ogni fase ha inizio/fine in secondi dall'avvio della sessione
  let acc=0;
  ph.forEach(p=>{p.start=acc; acc+=p.sec; p.end=acc;});
  return ph;
}
function openTimer(rid){
  const r=MOV.routine[rid];
  if(!r||!Array.isArray(r.esercizi)||!r.esercizi.length){toast('⚠️ Routine non valida');return;}
  const ph=buildPhases(r);
  if(!ph.length){toast('⚠️ Routine non valida');return;}
  if(TM)clearInterval(TM.int); // eventuali sessioni precedenti ancora in interval
  TM={r,ph,idx:0,epoch:null,pausedAt:0,running:false,int:null,done:false,workDone:0};
  drawTimer();
  requestWake();
}
function curPhase(){return TM&&TM.ph[TM.idx];}
/* secondi trascorsi sulla timeline della sessione (congelati in pausa) */
function tmElapsed(){
  if(!TM)return 0;
  return TM.running?Math.max(0,(Date.now()-TM.epoch)/1000):TM.pausedAt;
}
function drawTimer(){
  const p=curPhase(); if(!p)return;
  const r=TM.r;
  const next=TM.ph[TM.idx+1];
  const isWork=p.type==='work';
  const col=isWork?'var(--accent)':'var(--muted)';
  const label=isWork
    ?('POSIZIONE '+((p.giro-1)*(p.tot||0)+(p.pos||1))+'/'+((r.giri||2)*(p.tot||1))+' · '+(r.giri>1?'Giro '+p.giro+'/'+r.giri:'Giro unico'))
    :(p.label||'Pausa').toUpperCase();
  // in pausa mostra già il prossimo esercizio da preparare
  const shown=isWork?p.ex:(next&&next.type==='work'?next.ex:{n:'Riposo',v:''});
  const C=2*Math.PI*100;
  const remain=Math.max(0,p.end-tmElapsed());
  const frac=Math.max(0,Math.min(1,remain/p.sec));
  const wasOpen=!!$('#overlayRoot').firstChild;
  const aeId=document.activeElement&&document.activeElement.id;
  $('#overlayRoot').innerHTML=`
  <div class="fs">
    <div class="fshead">
      <button class="iconbtn" data-act="tmStop" aria-label="Chiudi">✕</button>
      <h3>${esc(r.nome)} · timer guidato</h3>
      <span class="chip" style="margin-left:auto">${r.giri||2} ${r.giri===1?'giro':'giri'} · ${r.lavoro||40}s/${r.pausa||20}s</span>
    </div>
    <div class="timerwrap">
      <span class="phase" style="color:${isWork?'var(--accent)':'var(--muted)'}">${label}</span>
      <div class="ring">
        <svg width="230" height="230" viewBox="0 0 230 230">
          <circle cx="115" cy="115" r="100" fill="none" stroke="var(--chip)" stroke-width="14"/>
          <circle id="tmRing" cx="115" cy="115" r="100" fill="none" stroke="${col}" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/>
        </svg>
        <div class="innum"><b id="tmNum">${pad(Math.ceil(remain))}</b><span class="tiny muted" style="margin-top:4px">secondi</span></div>
      </div>
      <div class="exname">${isWork?'':'Preparati: '}${esc(shown.n)}</div>
      <div class="exfig" data-an="${esc(shown.n)}" data-an-h="150" style="width:min(230px,60vw);margin:0 auto">${''}</div>
      ${shown.v?`<div class="exvar">${esc(shown.v)}</div>`:'<div class="exvar">&nbsp;</div>'}
      ${next?`<div class="nextex">Dopo: <b>${esc(next.type==='work'?next.ex.n:(next.label||'Pausa'))}</b></div>`:'<div class="nextex">Ultimo esercizio 🎉</div>'}
    </div>
    <div class="timerctrl">
      <button class="tbtn sec" data-act="tmSkip" title="Salta">⏭</button>
      <button class="tbtn" data-act="tmToggle" id="tmToggle" aria-label="Pausa o riprendi il timer">${TM.running?'⏸':'▶'}</button>
      <button class="tbtn sec" data-act="tmStop" title="Termina">⏹</button>
    </div>
  </div>`;
  if(!wasOpen)window._lastFocus=document.activeElement;
  if(aeId){const ae2=document.getElementById(aeId); if(ae2){try{ae2.focus();}catch(e){}}}
  mountAnims($('#overlayRoot'));
}
/* un solo AudioContext per tutta l'app: Safari ne ammette pochi e non li libera */
let AUD=null;
function audioCtx(){
  try{
    if(!AUD)AUD=new (window.AudioContext||window.webkitAudioContext)();
    if(AUD.state==='suspended')AUD.resume();
    return AUD;
  }catch(e){return null;}
}
function beep(freq=880,dur=.12,when=0){
  try{
    const ac=audioCtx(); if(!ac)return;
    const t=ac.currentTime+when;
    const o=ac.createOscillator(), g=ac.createGain();
    o.frequency.value=freq; o.type='sine';
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.3,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(ac.destination);
    o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}};
function tmStart(){
  if(!TM||TM.running)return;
  const p=curPhase();
  if(!p){tmFinish();return;}
  // timeline assoluta mentre gira: la pausa la congela riallineando l'epoch
  TM.epoch=Date.now()-TM.pausedAt*1000;
  TM.running=true;
  beep(880,.1); buzz(120);
  clearInterval(TM.int);
  TM.int=setInterval(tmTick,200);
  const b=$('#tmToggle'); if(b)b.textContent='⏸';
}
function tmPause(){
  if(!TM||!TM.running)return;
  TM.pausedAt=tmElapsed();
  TM.running=false;
  clearInterval(TM.int);
  const b=$('#tmToggle'); if(b)b.textContent='▶';
}
function tmTick(){
  if(!TM||!TM.running)return;
  const el=tmElapsed();
  // con la scheda nascosta i tick si dilazionano: in un colpo possono scadere più fasi
  let jumped=false;
  while(TM.idx<TM.ph.length&&el>=TM.ph[TM.idx].end){
    if(TM.ph[TM.idx].type==='work')TM.workDone++;
    TM.idx++; jumped=true;
  }
  if(TM.idx>=TM.ph.length){tmFinish();return;}
  if(jumped){
    buzz([150,80,150]); beep(660,.12); beep(660,.12,.18);
    const np=curPhase();
    if(np.type==='work')beep(980,.15,.36); else beep(520,.15,.36);
    drawTimer();
  }
  const p=curPhase();
  const remain=Math.max(0,p.end-el);
  const n=$('#tmNum'); if(n)n.textContent=pad(Math.ceil(remain));
  const C=2*Math.PI*100, ring=$('#tmRing');
  if(ring)ring.setAttribute('stroke-dashoffset',C*(1-Math.max(0,Math.min(1,remain/p.sec))));
}
function tmSkip(){
  if(!TM)return;
  if(TM.idx>=TM.ph.length-1){tmFinish();return;}
  // la fase saltata non conta come lavoro svolto; la timeline riparte dalla prossima
  TM.idx++;
  TM.pausedAt=TM.ph[TM.idx].start;
  TM.epoch=Date.now()-TM.pausedAt*1000;
  drawTimer();
}
function tmFinish(){
  if(!TM)return;
  clearInterval(TM.int);
  const first=!TM.done; TM.done=true;
  const done=TM.workDone; // fasi di lavoro effettivamente svolte
  if(done>0){S.wo[todayISO()]=true; save();}
  buzz([300,100,300,100,400]);
  try{beep(880,.18); beep(1100,.18,.22); beep(1320,.3,.44);}catch(e){}
  closeOverlay();
  render();
  toast(done>0
    ?(first?'💪 Routine completata! Allenamento registrato.':'Routine completata!')
    :'Sessione chiusa senza fasi di lavoro svolte: allenamento non registrato.');
}

/* ============================ WAKE LOCK ============================ */
let WL=null, WANT_WL=false;
async function requestWake(){
  WANT_WL=true;
  try{
    if('wakeLock' in navigator){
      const l=await navigator.wakeLock.request('screen');
      // se nel frattempo l'overlay è stato chiuso, il lock non deve restare preso
      if(WANT_WL){try{WL&&WL.release();}catch(e){} WL=l;}
      else{try{l.release();}catch(e){}}
    }
  }catch(e){}
}
function releaseWake(){WANT_WL=false; try{WL&&WL.release();}catch(e){} WL=null;}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&TM)requestWake();});

function doExportSpesa(){
  const items=computeSpesa().filter(i=>!S.spesa[i.nome]&&!i.opz);
  const mon=mondayOfWeek();
  let txt='🛒 Lista della spesa — Breaking Fat\n';
  txt+='Settimana dal '+mon.toLocaleDateString('it-IT')+(items.length?'':'\n\n✅ Tutto già spuntato!');
  let last=-1;
  items.forEach(i=>{
    if(i.cat!==last){txt+='\n\n◼ '+CATS[i.cat]+(i.cat===5?' (da verificare)':'')+'\n';last=i.cat;}
    txt+='• '+i.nome+': '+i.q+(i.nota?' ('+i.nota+')':'')+'\n';
  });
  txt+='\n( generata il '+new Date().toLocaleDateString('it-IT')+' )';
  if(navigator.share){
    navigator.share({title:'Lista della spesa',text:txt}).catch(e=>{if(!e||e.name!=='AbortError')copyList(txt);});
  }else copyList(txt);
}
function copyList(txt){
  const done=()=>toast('📋 Lista copiata: incollala dove vuoi');
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done).catch(()=>fallbackCopy(txt,done));
  }else fallbackCopy(txt,done);
}
function fallbackCopy(txt,done){
  const ta=document.createElement('textarea');
  ta.value=txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy'); done();}catch(e){toast('Copia non riuscita');}
  ta.remove();
}
function doExportBackup(){
  const data={app:'pft',v:APP_VERSION,esportato:new Date().toISOString(),state:S};
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='breaking-fat-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  toast('💾 Backup esportato');
}
function doImportBackup(file){
  if(file.size>3*1024*1024){toast('⚠️ File troppo grande (max 3 MB)');return;}
  const rd=new FileReader();
  rd.onerror=()=>{toast('⚠️ Impossibile leggere il file');};
  rd.onload=()=>{
    const prevS=S, prevIng=JSON.parse(JSON.stringify(ING_META));
    const restore=()=>{S=prevS; resetIngMeta(); Object.assign(ING_META,prevIng);};
    try{
      const j=JSON.parse(rd.result);
      if(!j||j.app!=='pft'||!isObj(j.state))throw new Error('formato');
      if(j.v&&j.v>APP_VERSION)toast('⚠️ Backup creato con una versione più recente: alcuni dati potrebbero non essere importati');
      const nuovo=sanitizeState(j.state);
      const nRic=(nuovo.ricettePers||[]).length, nPesi=(nuovo.pesi||[]).length;
      /* pre-valida con un render di prova: nessun persist, nessuna sovrascrittura */
      S=nuovo; resetIngMeta(); applyIngMeta(nuovo.ingMeta);
      render();
      /* ok: ripristina lo stato attuale PRIMA della conferma (annullare = nessun effetto) */
      restore();
      try{render();}catch(eRender){}
      confirmSheet('Il backup contiene '+nRic+' ricette personali e '+nPesi+' registrazioni di peso. Sostituirà TUTTI i dati attuali (verrà prima scaricato un backup dei dati correnti). Continuare?',()=>{
        doExportBackup();
        S=nuovo; resetIngMeta(); applyIngMeta(nuovo.ingMeta);
        save(); applyTheme(); closeOverlay(); render();
        toast('✅ Backup importato');
      });
    }catch(e){
      restore();
      try{applyTheme(); render();}catch(e2){}
      toast('⚠️ File non valido');
    }
  };
  rd.readAsText(file);
}
function shuffle(arr){
  // Fisher-Yates: mescolamento uniforme
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
  return arr;
}
function doGenera(){
  const oldPiano=JSON.parse(JSON.stringify(S.piano));
  ['pranzo','cena'].forEach(m=>{
    const ids=pool(m).map(r=>r.id);
    if(!ids.length)return;
    let seq;
    if(ids.length>=5){
      // 5 ricette distinte, poi permuta per differire il più possibile dal piano precedente
      seq=shuffle(ids.slice()).slice(0,5);
    }else{
      seq=[];
      while(seq.length<5)seq.push(ids[seq.length%ids.length]);
      shuffle(seq);
    }
    // evita ripetizioni in giorni consecutivi quando possibile
    for(let att=0;att<40;att++){
      let bad=false;
      for(let i=1;i<5;i++)if(seq[i]===seq[i-1]){bad=true;break;}
      if(!bad)break;
      shuffle(seq);
    }
    // massimizza le differenze rispetto alla settimana precedente
    const prev=DAYS.map(d=>oldPiano[d][m]);
    let best=seq,bestDiff=-1;
    for(let att=0;att<40;att++){
      const diff=seq.reduce((a,v,i)=>a+(v!==prev[i]?1:0),0);
      if(diff>bestDiff){bestDiff=diff;best=seq.slice();}
      // piccola perturbazione: scambia due posizioni (solo se non crea ricette uguali in giorni adiacenti)
      const i=Math.floor(Math.random()*5), j=Math.floor(Math.random()*5);
      [seq[i],seq[j]]=[seq[j],seq[i]];
      for(let k=1;k<5;k++)if(seq[k]===seq[k-1]){[seq[i],seq[j]]=[seq[j],seq[i]];break;}
    }
    DAYS.forEach((d,i)=>S.piano[d][m]=best[i]);
  });
  save(); render();
  toast('🎲 Nuova settimana generata: spesa aggiornata!');
}

/* ============================ EVENTI ============================ */
document.addEventListener('click',e=>{
  if(window._shieldUntil&&Date.now()<window._shieldUntil){e.stopPropagation();e.preventDefault();return;}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(e.target.closest('[data-stop]')&&el.dataset.act==='backdrop')return;
  const a=el.dataset;
  switch(a.act){
    case 'tab':setTab(a.tab);break;
    case 'theme':cycleTheme();break;
    case 'settings':openSettings();break;
    case 'backdrop':if(e.target.classList.contains('overlay'))closeOverlay();break;
    case 'close':closeOverlay();break;
    /* aggiornamento app */
    case 'updNow':{try{localStorage.removeItem(UPD_SKIP_KEY);}catch(e){} location.reload(); break;}
    case 'updSkip':{try{localStorage.setItem(UPD_SKIP_KEY,UPD_REMOTE||'');}catch(e){} closeOverlay(); break;}
    case 'goPasti':setTab('cucina');break;
    case 'infoOk':S.infoOk=true;save();render();break;

    /* pasti consumati / allenamento */
    case 'pasto':{
      const isoT=todayISO();
      S.pasti[isoT]=S.pasti[isoT]||{};
      if(S.pasti[isoT][a.m])delete S.pasti[isoT][a.m];else S.pasti[isoT][a.m]=true;
      save();render();break;
    }
    case 'wo':{
      const d=a.d?dateOfWeekDay(a.d):null;
      const key=d?iso(d):todayISO();
      if(S.wo[key])delete S.wo[key];else S.wo[key]=true;
      save();render();break;
    }

    /* spesa */
    case 'spesa':{
      const n=a.n;
      if(S.spesa[n])delete S.spesa[n]; else S.spesa[n]=true;
      save();
      el.classList.toggle('done',!!S.spesa[n]);
      el.setAttribute('aria-pressed',S.spesa[n]?'true':'false');
      const items=computeSpesa();
      const real=items.filter(i=>!i.opz);
      const done=real.filter(i=>S.spesa[i.nome]).length;
      const bar=$('#spesaBar'), num=$('#spesaNum');
      if(bar){const pc=Math.round(done/real.length*100); bar.style.width=pc+'%'; const bw=bar.closest('.bar'); if(bw)bw.setAttribute('aria-valuenow',String(pc));}
      if(num)num.textContent=done+'/'+real.length;
      const item=items.find(x=>x.nome===n);
      if(item){
        const card=document.querySelector(`.card[data-cat="${item.cat}"]`);
        const sub=card&&card.querySelector('h2 .sub');
        if(sub){
          const sec=items.filter(x=>x.cat===item.cat);
          sub.textContent=sec.filter(x=>S.spesa[x.nome]).length+'/'+sec.length;
        }
      }
      break;
    }
    case 'exportSpesa':doExportSpesa();break;
    case 'nuovaSett':
      confirmSheet('Azzerare tutte le spunte della spesa e della sessione batch?',()=>{
        S.spesa={};S.steps={};save();render();toast('🔄 Spunte azzerate');
      });break;

    /* step sessione */
    case 'step':{
      const k=a.k;
      if(S.steps[k])delete S.steps[k]; else S.steps[k]=true;
      save();el.classList.toggle('done',!!S.steps[k]);el.setAttribute('aria-pressed',S.steps[k]?'true':'false');updateStepUI(k);break;
    }

    /* piano */
    case 'slot':openPicker(a.d,a.m);break;
    case 'pick':{
      S.piano[PICK.d][PICK.m]=a.id;save();closeOverlay();render();
      const r=byId(a.id);toast('✅ '+r.titolo+' → '+DOW_NAME[PICK.d]);break;
    }
    case 'pickSearch':break;
    case 'genera':doGenera();break;
    case 'ripristina':
      confirmSheet('Ripristinare il piano originale?',()=>{
        S.piano=JSON.parse(JSON.stringify(PIANO_DEFAULT));save();render();toast('↩︎ Piano originale ripristinato');
      });break;

    /* ricettario */
    case 'openRic':openRic(a.id);break;
    case 'newRic':openRicForm(null);break;
    case 'editRic':openRicForm(a.id);break;
    case 'delRic':
      confirmSheet('Eliminare questa ricetta personale? Le porzioni assegnate nel piano torneranno al piano standard e la spesa si aggiornerà.',()=>{
        S.ricettePers=S.ricettePers.filter(r=>r.id!==a.id);
        Object.keys(S.steps).forEach(k=>{if(k.indexOf(a.id+':')===0)delete S.steps[k];});
        DAYS.forEach(d=>['pranzo','cena'].forEach(m=>{if(S.piano[d][m]===a.id)S.piano[d][m]=PIANO_DEFAULT[d][m];}));
        save();closeOverlay();render();toast('🗑 Ricetta eliminata');
      });break;
    case 'addIng':{
      const box=$('#fIng');
      const ix=box.children.length;
      box.insertAdjacentHTML('beforeend',ingRowHtml({n:'',q:'',u:'g'},ix));
      break;
    }
    case 'delIng':{
      const row=el.closest('.ingrow');
      if(row){const box=$('#fIng'); if(box.children.length>1)row.remove(); else toast('⚠️ Serve almeno un ingrediente');}
      break;
    }
    case 'saveRic':{
      const tit=($('#fTit').value||'').trim();
      if(!tit){toast('⚠️ Serve un titolo');break;}
      const ings=[...$('#fIng').children].map(row=>({
        n:row.querySelector('.in').value.trim(),
        q:row.querySelector('.iu').value==='q.b.'?0:(parseFloat(String(row.querySelector('.iq').value).replace(',','.'))||0),
        u:row.querySelector('.iu').value,
        c:parseInt(row.querySelector('.ic').value)
      })).filter(i=>i.n);
      const prep=($('#fPrep').value||'').split('\n').map(s=>s.trim()).filter(Boolean).map(t=>({m:'tegame',t}));
      const tipo=$('#fTipo').value;
      const data={
        id:EDIT_RIC?EDIT_RIC.id:uid(), tipo, origine:'personale',
        titolo:tit, short:shortName(tit),
        kcal:Math.max(0,Math.min(5000,Math.round(parseFloat(String($('#fKcal').value).replace(',','.'))||0))),
        resa:Math.max(1,Math.min(50,Math.round(parseFloat(String($('#fResa').value).replace(',','.'))||1))),
        ingredienti:ings, preparazione:prep.length?prep:[{m:'tegame',t:'Preparazione a piacere.'}],
        porzione:($('#fPorz').value||'1 porzione').trim(),
        servizio:($('#fServ').value||'').trim()||'Scalda e gusta.',
        cong:($('#fCong').value||'').trim()||'2-3 mesi. Scongela in frigo la sera prima.'
      };
      // applica categoria/unità scelte nel form a tutti gli ingredienti, anche ai già noti
      ings.forEach(i=>{
        const base=ING_META_BASE[i.n];
        const m=ING_META[i.n]||{};
        const c=Number.isFinite(i.c)?Math.max(0,Math.min(CATS.length-1,Math.round(i.c))):CAT_DEF;
        const u=(i.u==='ml'||i.u==='pz')?i.u:undefined;
        const gusto=i.u==='q.b.';
        m.c=c;
        if(u)m.u=u; else delete m.u;
        m.gusto=gusto;
        if(!base||base.c!==c||base.u!==u||!!base.gusto!==gusto)m.pers=true;
        ING_META[i.n]=m;
      });
      persistIngMeta();
      if(EDIT_RIC){
        S.ricettePers=S.ricettePers.map(r=>r.id===data.id?data:r);
        // gli step "id:idx" di questa ricetta puntano a testi ormai cambiati
        Object.keys(S.steps).forEach(k=>{if(k.indexOf(data.id+':')===0)delete S.steps[k];});
      }
      else S.ricettePers.push(data);
      save();closeOverlay();render();
      toast(EDIT_RIC?'✏️ Ricetta aggiornata':'➕ Ricetta salvata: usala nel piano!');
      break;
    }
    case 'filRic':{
      FILTRO_RIC=a.f;
      $$('#ricfil .btn').forEach(b=>b.classList.toggle('ghost',b.dataset.f!==a.f));
      const q=$('#ricerca');
      $('#recgrid').innerHTML=recGridHtml(a.f,q?q.value:'');
      break;
    }

    /* timer */
    case 'timer':openTimer(a.r);break;
    case 'tmToggle':TM.running?tmPause():tmStart();break;
    case 'tmSkip':tmSkip();break;
    case 'tmStop':tmPause();closeOverlay();toast('Timer chiuso');break;

    /* backup & reset */
    case 'expBackup':doExportBackup();break;
    case 'impBackup':$('#fileBackup').click();break;
    case 'reset':
      confirmSheet('Azzerare TUTTI i dati (piano, ricette personali, spunte, cronologia)? Operazione non reversibile.',()=>{
        localStorage.removeItem(PKEY);S=DEF();resetIngMeta();save();applyTheme();closeOverlay();render();toast('Dati azzerati');
      });break;
    case 'confOk':{const cb=window._confCb;window._confCb=null;closeOverlay();cb&&cb();break;}
    case 'passiPlus':{
      const isoT=todayISO();
      S.passi[isoT]=Math.min(200000,(S.passi[isoT]||0)+(parseInt(a.v)||0));save();render();break;
    }

    /* v2: calorie, profilo, peso, tutorial */
    case 'calPanel':openCalPanel();break;
    case 'calPreset':{
      S.calorie=parseInt(a.v);S.obDone=true;save();
      if($('#calRange')){$('#calRange').value=S.calorie;$('#calVal').innerHTML=S.calorie+'<small> kcal/giorno</small>';}
      render();toast('🎯 Obiettivo: ~'+S.calorie+' kcal/giorno');break;
    }
    case 'calSug':{
      const sug=kcalSuggerite();
      if(sug){S.calorie=sug;save();closeOverlay();render();toast('✨ Calorie suggerite: ~'+sug+' kcal/giorno');}
      break;
    }
    case 'tut':openTut(a.ex);break;
    case 'profEdit':openProfiloForm(false);break;
    case 'profSave':{
      const nome=($('#pfNome').value||'').trim();
      const sesso=$('#pfSesso').value;
      const eta=parseInt($('#pfEta').value)||null;
      const altezza=parseFloat(String($('#pfAlt').value).replace(',','.'))||null;
      const obb=parseFloat(String($('#pfObb').value).replace(',','.'))||null;
      S.profilo={nome,sesso,eta,altezza,pesoObiettivo:obb};
      S.obDone=true;save();closeOverlay();setTab('profilo');
      toast('👤 Profilo salvato');break;
    }
    case 'obSkip':S.obDone=true;save();closeOverlay();break;
    case 'pesoSave':{
      const v=parseFloat(String($('#pesoIn').value).replace(',','.'));
      if(!v||v<30||v>300){toast('⚠️ Inserisci un peso valido (30–300 kg)');break;}
      const d=todayISO();
      const i=S.pesi.findIndex(x=>x.d===d);
      if(i>=0)S.pesi[i].kg=v; else S.pesi.push({d,kg:v});
      S.pesi.sort((x,y)=>x.d<y.d?-1:1);
      save();render();
      toast('⚖️ Peso registrato: '+nf(v)+' kg'+(bmiCalc(v)?' · BMI '+nf(bmiCalc(v)):''));break;
    }
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='ricerca'){$('#recgrid').innerHTML=recGridHtml(FILTRO_RIC,el.value);}
  if(el.id==='pickSearch'){const l=$('#pickList'); if(l)l.innerHTML=pickListHtml(el.value);}
});
// lo stato aperto/chiuso del ricettario sopravvive ai re-render
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='ricDet')RIC_OPEN=e.target.open;},true);
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.act==='passi'){
    const v=parseInt(el.value)||0;
    S.passi[todayISO()]=Math.max(0,v);save();renderSoon();
  }
  if(el.id==='fileBackup'&&el.files[0]){doImportBackup(el.files[0]); el.value='';} /* reset: stesso file re-selezionabile */
  if(el.id==='calRange'){save();renderSoon();} /* persisti solo al rilascio dello slider, non ad ogni trascinamento */
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  const r=$('#overlayRoot'); if(!r||!r.firstChild)return;
  if(r.querySelector('[data-stop]'))return;
  closeOverlay();
});

/* ---------- controllo nuove versioni ---------- */
const UPD_SKIP_KEY='pft_upd_skip_v1';
let UPD_REMOTE=null;
async function checkUpdate(){
  try{
    if(location.protocol!=='http:'&&location.protocol!=='https:')return;
    if($('#overlayRoot').firstChild)return; // non sovrapporre ad altri sheet
    const base=location.href.split('#')[0].split('?')[0];
    const r=await fetch(base+'?nc='+Date.now(),{cache:'no-store'});
    if(!r.ok)return;
    const m=(await r.text()).match(/const BUILD='(\d{6})'/);
    if(!m)return;
    if(!(Number(m[1])>Number(BUILD)))return;
    if(localStorage.getItem(UPD_SKIP_KEY)===m[1])return; // già rifiutata per questa build
    UPD_REMOTE=m[1];
    openSheet(`
      <h3>🔄 Nuova versione disponibile</h3>
      <p class="small" style="margin:8px 0">È online la <b>build ${m[1]}</b> (qui hai la ${BUILD}).<br>Aggiorna per avere le ultime novità e correzioni.</p>
      <div class="btnrow">
        <button class="btn" data-act="updNow">🔄 Aggiorna ora</button>
        <button class="btn subtle" data-act="updSkip">Più tardi</button>
      </div>
    `);
  }catch(e){}
}

/* ============================ INIT ============================ */
/* Manifest PWA generato a runtime: rende "Aggiungi a schermata Home" disponibile
   su Chrome Android quando l'app è servita via http/https (su file locale la voce
   non esiste). Icona disegnata su canvas: nessun file esterno. */
(function buildManifest(){
  try{
    if(location.protocol!=='http:'&&location.protocol!=='https:')return;
    const c=document.createElement('canvas'); c.width=c.height=512;
    const x=c.getContext('2d'); if(!x)return;
    x.fillStyle='#2e7d32'; x.fillRect(0,0,512,512);
    x.font='300px serif'; x.textAlign='center'; x.textBaseline='middle';
    x.fillStyle='#fff'; x.fillText('🔥',256,276);
    const icon=c.toDataURL('image/png');
    const dir=location.href.slice(0,location.href.lastIndexOf('/')+1);
    const man={
      name:'Breaking Fat — Meal Prep & Movimento', short_name:'Breaking Fat',
      description:'Piano pasti settimanale, spesa, sessioni batch e movimento.',
      start_url:location.href.split('#')[0], scope:dir,
      display:'standalone', orientation:'portrait',
      background_color:'#f2f5f1', theme_color:'#f4f6f3',
      icons:[{src:icon,sizes:'512x512',type:'image/png',purpose:'any'},{src:icon,sizes:'192x192',type:'image/png',purpose:'any'}]
    };
    const l=document.createElement('link'); l.rel='manifest';
    l.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(man));
    document.head.appendChild(l);
  }catch(e){}
})();
applyTheme();
render();
if(!S.profilo&&!S.obDone)openOnboarding();
setTimeout(checkUpdate,2500); // check nuove versioni a avvio
</script>
